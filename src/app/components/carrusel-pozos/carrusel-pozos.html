<h2 class="carrusel-pozos__titulo">{{ titulo() }}</h2>

@if (cargando()) {
  <div class="carrusel-pozos__cargando">
    <app-spinner />
  </div>
} @else if (error(); as msg) {
  <div class="carrusel-pozos__estado carrusel-pozos__estado--error" role="alert">
    <p>{{ msg }}</p>
    <button type="button" class="carrusel-pozos__reintentar" (click)="reintentar.emit()">Reintentar</button>
  </div>
} @else if (pozos().length === 0) {
  <div class="carrusel-pozos__estado">
    <p>{{ mensajeVacio() }}</p>
  </div>
} @else {
  <div class="carrusel-pozos__wrapper">
    <button
      type="button"
      class="carrusel-pozos__btn carrusel-pozos__btn--prev"
      aria-label="Pozo anterior"
      (click)="desplazarCarrusel(-1)"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M15 6l-6 6 6 6"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

    <div class="carrusel-pozos__carrusel" #carrusel>
      @for (pozo of pozos(); track pozo.id) {
        <article class="carrusel-pozos__item">
          <app-tarjeta-pozo
            [imagenUrl]="pozo.imagenUrl"
            [imagenAlt]="pozo.titulo"
            [titulo]="pozo.titulo"
            [estado]="pozo.estado"
            [badgeEnImagen]="true"
            [compacta]="true"
            [montoRecaudado]="pozo.montoRecaudado"
            [montoObjetivo]="pozo.montoObjetivo"
          >
            @if (extraTemplate(); as tpl) {
              <ng-container tarjeta-pozo-extra-post [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="{ $implicit: pozo }" />
            }
          </app-tarjeta-pozo>
        </article>
      }
    </div>

    <button
      type="button"
      class="carrusel-pozos__btn carrusel-pozos__btn--next"
      aria-label="Pozo siguiente"
      (click)="desplazarCarrusel(1)"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M9 6l6 6-6 6"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>

  @if (pozos().length > 1) {
    <p class="carrusel-pozos__hint-mobile" aria-hidden="true">Desliza para ver más →</p>
  }
}
