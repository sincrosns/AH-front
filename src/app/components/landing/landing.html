<section class="landing">
  <div class="landing__hero">
    <!-- Flechas del carrusel: por ahora son un placeholder (deshabilitadas),
         hasta que se cargue el contenido rotativo del hero. -->
    <button
      type="button"
      class="landing__hero-arrow landing__hero-arrow--prev"
      aria-label="Anterior"
      disabled
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
        <path d="M15 6 9 12l6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <div class="landing__hero-contenido">
      <h1 class="landing__titulo">Innovando soluciones</h1>
      <p class="landing__bajada">
        Nos dedicamos a desarrollar ideas innovadoras para resolver problemas reales, creando
        soluciones a medida que impulsan tu proyecto hacia adelante.
      </p>
    </div>

    <!-- Logo de marca con efecto de profundidad: el PNG se usa como mascara CSS
         sobre tres capas desplazadas (sombra profunda, capa intermedia y logo
         principal). Va completo, centrado e inclinado -12deg. -->
    <div class="landing__hero-logo">
      <div class="landing__hero-logo-stack" role="img" aria-label="Sincro">
        <div class="landing__hero-logo-layer landing__hero-logo-layer--depth"></div>
        <div class="landing__hero-logo-layer landing__hero-logo-layer--mid"></div>
        <div class="landing__hero-logo-shadow">
          <div class="landing__hero-logo-layer landing__hero-logo-layer--main"></div>
        </div>
      </div>
    </div>

    <button
      type="button"
      class="landing__hero-arrow landing__hero-arrow--next"
      aria-label="Siguiente"
      disabled
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
        <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>
</section>
